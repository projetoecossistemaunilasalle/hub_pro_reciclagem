<head>

<body>
    <div class="container">
        <h2>Entrar</h2>
        <form action="#" method="post">
            <div class="input-field">
                <input type="text" name="email" id="email-login" placeholder="Digite o e-mail">
                <label >E-mail: </label>
            </div>
            <div class="input-field">
                <input type="password" name="senha" id="senha-login" placeholder="Digite a senha">
                <label >Senha: </label>
            </div>
            <div class="center">
                <button type="button" value="entrar" id="entrar" onclick="login()">Entrar</button>
            </div>
        </form>

        const app = firebase.initializeApp(firebaseConfig);
    
        function login(){
        const email = document.getElementById('email-login').value
        const password = document.getElementById('senha-login').value
    
        app.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log('Logado com sucesso');
          pagina_logado();
        })
        .catch((error) => {
          const errorCode = error.code;
          const errorMessage = error.message;
          console.log('Algo deu errado');
          erro();
        });
        };
